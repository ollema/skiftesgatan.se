name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Generate content collections
        run: node --input-type=module -e "import{createBuilder}from'@content-collections/core';const b=await createBuilder('./content-collections.ts');await b.build();"

      - run: pnpm lint

      - run: pnpm knip

      - run: pnpm check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    container:
      # Must match the @playwright/test version in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the lint job saves the store; the container jobs restore it, so
      # they don't race each other for the same cache key.
      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - run: pnpm test:unit

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    container:
      # Must match the @playwright/test version in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          save-cache: false
          require-lockfile: true

      - run: pnpm test:e2e
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-not-for-production
          BETTER_AUTH_URL: http://localhost:4173

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
